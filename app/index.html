<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hot Zone</title>
<meta name="description" content="Braves and Southern Miss baseball stats: every player, every pitch.">
<meta name="theme-color" content="#0a1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hot Zone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" id="favicon" type="image/svg+xml" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="bar">
  <a class="mark" href="#" aria-label="Hot Zone home"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="11.5" y="11" width="9" height="10" rx="1.5" fill="currentColor"/><path d="M12.3 4v24M19.7 4v24M5 11.7h22M5 20.3h22" stroke="currentColor" stroke-width="1" opacity=".45"/></svg><span>Hot Zone</span></a>
  <a class="navlink leaders" href="#lead" data-nav="lead">Leaders</a>
  <button class="helpbtn" id="help" aria-label="How to use Hot Zone">?</button>
  <button class="findbtn" data-open-find aria-label="Search players and stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search players and stats</span><kbd>/</kbd></button>
  <button class="themebtn" id="theme" aria-label="Switch light or dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <div class="teamswitch" role="radiogroup" aria-label="Team">
    <button class="t-atl" role="radio" data-mode="atl"><i></i><span class="long">Braves</span><span class="short">ATL</span></button>
    <button class="t-usm" role="radio" data-mode="usm"><i></i><span class="long">Southern Miss</span><span class="short">USM</span></button>
  </div>
</div></header>
<main id="main"><div class="skel" style="margin-top:30px"></div></main>
<nav class="tabbar" aria-label="Main">
  <a href="#" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>Home</a>
  <a href="#team-atl" data-nav="team" id="tabteam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Full stats</a>
  <a href="#lead" data-nav="lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Leaders</a>
  <button data-open-find><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="palette" id="palette" role="dialog" aria-label="Search">
  <div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="pq" type="search" placeholder="Player, stat, or both, like “Riley chase rate”" autocomplete="off" spellcheck="false" aria-label="Search">
    <button class="close" onclick="closePalette()">Close</button></div>
  <div class="res" id="pres"></div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="Stat details"></div>
<div class="tour" id="tour" role="dialog" aria-modal="true" aria-label="How to use Hot Zone"></div>
<div id="tip" role="tooltip"></div>
<script src="glossary.js"></script>
<script src="stats.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
